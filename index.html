<style>

  :root{
    --bg:#0d121b;
    --surface:#141b28;
    --border:#232e40;
    --text:#e9edf5;
    --text-dim:#8b96ab;
    --accent:#4fa8f0;
    --accent-hover:#6cb8f5;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f5f8fb;
      --surface:#ffffff;
      --border:#dde6ee;
      --text:#0f1b2d;
      --text-dim:#5c6b80;
      --accent:#2f8fe0;
      --accent-hover:#4fa8f0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d121b; --surface:#141b28; --border:#232e40;
    --text:#e9edf5; --text-dim:#8b96ab; --accent:#4fa8f0; --accent-hover:#6cb8f5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
  }
  .card{
    width:100%;
    max-width:460px;
    margin:24px auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:36px 32px;
  }
  .mark{
    width:44px;height:44px;
    border-radius:11px;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .mark img{width:100%;height:100%;display:block;object-fit:cover;}
  h1{
    font-size:22px;
    font-weight:650;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  p.tagline{
    color:var(--text-dim);
    font-size:14.5px;
    line-height:1.5;
    margin:0 0 28px;
    max-width:34ch;
  }
  .meta{
    display:flex;
    gap:18px;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:24px;
    padding-bottom:24px;
    border-bottom:1px solid var(--border);
  }
  .meta div strong{
    display:block;
    color:var(--text);
    font-size:14.5px;
    font-weight:600;
  }
  button.dl{
    width:100%;
    background:var(--accent);
    color:#08131f;
    border:none;
    border-radius:10px;
    padding:13px 16px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s ease;
  }
  button.dl:hover{ background:var(--accent-hover); }
  button.dl:active{ transform:translateY(1px); }
  button.dl svg{width:16px;height:16px;flex-shrink:0;}
  a.dl-secondary{
    width:100%;
    background:transparent;
    color:var(--accent);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:10px;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease;
  }
  a.dl-secondary:hover{ background:var(--surface); border-color:var(--accent); }
  a.dl-secondary:active{ transform:translateY(1px); }
  a.dl-secondary svg{width:15px;height:15px;flex-shrink:0;}
  .status{
    text-align:center;
    font-size:13px;
    color:var(--text-dim);
    margin-top:12px;
    min-height:16px;
  }
  .hint{
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:24px;
    line-height:1.5;
  }
  .hint code{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:4px;
    padding:1px 5px;
    font-size:12px;
  }

  #screenTutorial .wrap{
    width:100%;
    max-width:720px;
  }
  #screenTutorial .frame{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
  }
  #screenTutorial .imgbox{
    aspect-ratio:16/10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
  }
  #screenTutorial .imgbox img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  #screenTutorial .missing{
    color:var(--text-dim);
    font-size:13.5px;
    text-align:center;
    padding:0 24px;
  }
  #screenTutorial .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--border);
    background:rgba(20,27,40,0.7);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]) #screenTutorial .nav-btn{ background:rgba(255,255,255,0.75); }
  }
  :root[data-theme="dark"] #screenTutorial .nav-btn{ background:rgba(20,27,40,0.7); }
  #screenTutorial .nav-btn:hover{ background:var(--accent); color:#08131f; }
  #screenTutorial .nav-btn:disabled{ opacity:0.3; cursor:default; }
  #screenTutorial .nav-btn:disabled:hover{ background:rgba(20,27,40,0.7); color:var(--text); }
  #screenTutorial .nav-btn.prev{ left:14px; }
  #screenTutorial .nav-btn.next{ right:14px; }
  #screenTutorial .nav-btn svg{ width:20px; height:20px; }

  #screenTutorial .bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:16px 20px;
    border-top:1px solid var(--border);
  }
  #screenTutorial .step-label{
    font-size:14px;
    font-weight:600;
  }
  #screenTutorial .step-label span{
    color:var(--text-dim);
    font-weight:400;
  }
  #screenTutorial .dots{
    display:flex;
    gap:6px;
  }
  #screenTutorial .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--border);
    cursor:pointer;
    border:none;
    padding:0;
  }
  #screenTutorial .dot.active{ background:var(--accent); }

  #screenTutorial .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--text-dim);
    text-decoration:none;
    margin-bottom:14px;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
  }
  #screenTutorial .back-link:hover{ color:var(--accent); }
  #screenTutorial .back-link svg{ width:14px; height:14px; }
  #screenTutorial .caption{
    padding:16px 20px 0;
    font-size:14.5px;
    line-height:1.55;
    color:var(--text);
  }
  #screenTutorial .caption:empty{ display:none; }
  #screenTutorial .caption a{
    color:var(--accent);
    text-decoration:underline;
    word-break:break-all;
  }
  #screenTutorial .caption a:hover{ color:var(--accent-hover); }

  #screenDownload, #screenTutorial{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  body.view-tutorial #screenDownload{ display:none; }
  body:not(.view-tutorial) #screenTutorial{ display:none; }

</style>
</head>
<body>

  <div id="screenDownload">

    { image: 'tutorial/step5.png', caption: 'Now that you have an account, click the profile picture in the top right.' },
    { image: 'tutorial/step6.png', caption: 'Scroll down until you see "Access Tokens" and click it.' },
    { image: 'tutorial/step7.png', caption: 'Click on "Create new token".' },
    { image: 'tutorial/step8.png', caption: 'Give your token a name and select the "Inference" preset.' },
    { image: 'tutorial/step9.png', caption: 'Scroll down and click "Create token".' },
    { image: 'tutorial/step10.png', caption: 'Now, click the "Copy" button beside the token and paste it into the input field in the html file!' }
  ];

  const imgbox = document.getElementById('imgbox');
  const captionEl = document.getElementById('caption');
  const stepLabel = document.getElementById('stepLabel');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let current = 1;

  /* Escapes HTML, then turns "link:URL" into a clickable <a> tag.
     "link:" must be followed immediately (no space) by the link target;
     the target runs until the next whitespace character. */
  function renderCaption(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    const escaped = div.innerHTML;
    return escaped.replace(/link:(\S+)/g, function (_, target) {
      const clean = target.replace(/[.,;:!?)]+$/, ''); // trim trailing punctuation
      const trail = target.slice(clean.length);
      const href = /^https?:\/\//i.test(clean) ? clean : 'https://' + clean;
      return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + clean + '</a>' + trail;
    });
  }

  STEPS.forEach((_, idx) => {
    const dot = document.createElement('button');
    dot.className = 'dot';
    dot.type = 'button';
    dot.setAttribute('aria-label', 'Go to step ' + (idx + 1));
    dot.addEventListener('click', () => goTo(idx + 1));
    dotsEl.appendChild(dot);
  });

  function render() {
    const step = STEPS[current - 1] || {};

    imgbox.innerHTML = '';
    if (step.image) {
      const img = document.createElement('img');
      img.src = step.image;
      img.alt = 'Step ' + current;
      img.onerror = () => {
        imgbox.innerHTML = '<div class="missing">Missing image: ' + step.image + '</div>';
      };
      imgbox.appendChild(img);
    } else {
      imgbox.innerHTML = '<div class="missing">No image for this step</div>';
    }

    captionEl.innerHTML = renderCaption(step.caption);

    stepLabel.innerHTML = 'Step ' + current + ' <span>of ' + STEPS.length + '</span>';

    [...dotsEl.children].forEach((d, idx) => {
      d.classList.toggle('active', idx + 1 === current);
    });

    prevBtn.disabled = current === 1;
    nextBtn.disabled = current === STEPS.length;
  }

  function goTo(n) {
    current = Math.min(STEPS.length, Math.max(1, n));
    render();
  }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });

  render();

</script>

</body>
</html>
